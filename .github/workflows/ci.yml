name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Specification consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check fixtures and documentation links
        run: python3 scripts/check_spec.py

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust workspace does not exist yet; these steps start running when Cargo.toml is added.
      - name: Report missing workspace
        if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; Rust checks skipped."
      - name: Install toolchain
        if: hashFiles('Cargo.toml') != ''
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check
      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --all-features --locked
