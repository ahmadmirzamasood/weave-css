[package]
name = "weave-compiler"
description = "Compiler library for the Weave stylesheet language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/weave-compiler"
keywords = ["css", "preprocessor", "stylesheet", "compiler", "weave"]
categories = ["compilers", "web-programming"]
include = ["src/**/*.rs", "README.md", "LICENSE", "Cargo.toml"]

[lints]
workspace = true

[dev-dependencies]
# Independent CSS Syntax 3 parser used only to validate emitted CSS in tests
# (ADR 0010). Default features pull in proc macros and phf; not needed.
cssparser = { version = "=0.38.0", default-features = false }

[features]
# Exposes `weave_compiler::fuzzing`, the tokenizer and parser entry points
# used by the fuzz targets in fuzz/. Not a stable API.
fuzzing = []
